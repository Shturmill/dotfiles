general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150
    on-timeout = brightnessctl -sd intel_backlight set 10
    on-resume = brightnessctl -rd intel_backlight
}

listener {
    timeout = 300
    on-timeout = on-ac || loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = on-ac || { pidof hyprlock && hyprctl dispatch dpms off; }
    on-resume = hyprctl dispatch dpms on; brightnessctl -rd intel_backlight
}

listener {
    timeout = 1800
    on-timeout = on-ac || systemctl suspend
}
