general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# `on-ac` exits 0 on mains, 1 on battery, from packages/on-ac.nix, so
# `on-ac || x` runs x on battery and `on-ac && x` only on mains. Before it
# existed these listeners called an uninstalled command, failed with 127, and
# the AC branches ran inverted: the machine suspended on mains and never
# locked there.

# Dim first: the backlight is this panel's biggest consumer. No device named —
# brightnessctl picks the only backlight class device, amdgpu_bl1. (It used to
# say intel_backlight, which does not exist on this AMD laptop, so the dim
# never happened.)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = on-ac || loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = on-ac || { pidof hyprlock && hyprctl dispatch dpms off; }
    on-resume = hyprctl dispatch dpms on; brightnessctl -r
}

# On AC: never suspend; lock at most after 20 min idle (300/330/900 stay
# battery-only).
listener {
    timeout = 1200
    on-timeout = on-ac && loginctl lock-session
}

# 15 min rather than 30: on battery the screen has been off for nine and a
# half of those, and s2idle on this platform is worth more than the rest.
listener {
    timeout = 900
    on-timeout = on-ac || systemctl suspend
}
