background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 4
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.16
    vibrancy_darkness = 0.1
}

# Часы
label {
    monitor =
    text = $TIME
    color = rgba(220, 215, 186, 1.0)
    font_size = 110
    font_family = JetBrains Mono ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(152, 147, 165, 0.9)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 20
    halign = center
    valign = center
}

# Поле ввода пароля
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(118, 148, 106, 0.8)
    inner_color = rgba(31, 31, 40, 0.6)
    font_color = rgba(220, 215, 186, 1.0)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>󰌾 Введите пароль...</i>
    hide_input = false
    rounding = -1
    check_color = rgba(220, 165, 97, 0.8)
    fail_color = rgba(195, 64, 67, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    position = 0, -80
    halign = center
    valign = center
}

# Раскладка клавиатуры
label {
    monitor =
    text = $LAYOUT
    color = rgba(152, 147, 165, 0.8)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -150
    halign = center
    valign = center
}
