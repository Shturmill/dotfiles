font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0
disable_ligatures never
input_delay 0
sync_to_monitor no


# Zed's "Ayu Dark" terminal palette. Placeholders where a value is a base16
# slot; ANSI colours outside the scheme are spelled out. The bright variants
# are genuinely darker than the normals — that's what the theme ships.

foreground #@base05@
background #@base00@

background_opacity 0.96
dynamic_background_opacity yes

cursor #@base0D@
cursor_text_color #@base00@
cursor_shape block
cursor_blink_interval -1
cursor_trail 2

selection_foreground #@base05@
selection_background #@zed_selection@

mark1_foreground #@base00@
mark1_background #@base0D@

color0  #@base00@
color1  #@base08@
color2  #@base0B@
color3  #@base0A@
color4  #@base0D@
color5  #39bae5
color6  #@base0C@
color7  #@base05@
color8  #545557
color9  #83353b
color10 #567627
color11 #92582b
color12 #27618c
color13 #205a78
color14 #4c806f
color15 #@base07@


# Window

initial_window_width  100c
initial_window_height 30c

window_margin_width 0
window_padding_width 12
window_border_width 0

draw_minimal_borders no
remember_window_size yes
resize_in_steps no

linux_display_server wayland
wayland_titlebar_color system
hide_window_decorations yes
confirm_os_window_close 0


# Tabs

tab_bar_edge bottom
tab_bar_style fade
tab_fade 1 0.5 0.25 0
tab_bar_min_tabs 2

tab_bar_background      #@zed_surface@

active_tab_foreground   #@base05@
active_tab_background   #@base00@
active_tab_font_style   bold

inactive_tab_foreground #@base04@
inactive_tab_background #@zed_surface@
